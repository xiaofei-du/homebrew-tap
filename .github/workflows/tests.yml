name: Homebrew
run-name: Homebrew (${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }})
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact update commit to test
        type: string
        default: ''
permissions:
  contents: read
jobs:
  automation:
    name: Update automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
  formula:
    name: Formula (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_AUTOREMOVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the requested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          fi
      - name: Register the checked-out tap
        run: brew tap xiaofei-du/tap "$GITHUB_WORKSPACE"
      - name: Install an older formula version and upgrade
        run: |
          formula="$(brew --repo xiaofei-du/tap)/Formula/attention.rb"
          current_version="$(sed -nE 's/^  version "([^"]+)"$/\1/p' "$formula")"
          test -n "$current_version"
          cp "$formula" "$RUNNER_TEMP/attention-current.rb"
          sed -i '' -E 's/^  version "[^"]+"$/  version "0.0.0"/' "$formula"
          brew install --build-from-source xiaofei-du/tap/attention
          attention --version | grep -Fx 'Attention installer 0.0.0'
          cp "$RUNNER_TEMP/attention-current.rb" "$formula"
          brew upgrade xiaofei-du/tap/attention
          attention --version | grep -Fx "Attention installer $current_version"
      - name: Test and audit
        run: |
          brew test xiaofei-du/tap/attention
          brew audit --strict xiaofei-du/tap/attention
      - name: Reinstall and verify commands
        run: |
          brew reinstall xiaofei-du/tap/attention
          attention --version
          attention setup --help
          attention update --help
      - name: Remove only the installed formula
        run: |
          brew uninstall --formula --force xiaofei-du/tap/attention
          test ! -e "$(brew --prefix)/bin/attention"
          test ! -d "$(brew --cellar)/attention"
          brew list --versions uv
